[build-system]
requires = ["build"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-actions"
version = "0.1.0"
description = "A small Flask greeting application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask",
]

[tool.setuptools.packages.find]
where = ["src"]