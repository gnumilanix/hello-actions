on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    pull_request:
        branches:
            - main
    workflow_dispatch:
permissions:
    packages: write
env:
    PYTHON_VERSION: 3.11
    PYTHON_REQUIREMENTS: src/requirements.txt
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }} -r src/requirements-lint.txt
            - name: Lint
              run: ruff check src --exit-zero
    security-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install bandit
            - name: Security Scan
              run: bandit -r src/
    unit-test:
        runs-on: ubuntu-latest
        needs: [lint, security-scan]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }} -r src/requirements-test.txt
            - name: Unit tests
              run: pytest -q tests
    build:
        runs-on: ubuntu-latest
        needs: [unit-test]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
    docker-build:
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v7
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
    integration-test:
        runs-on: ${{ matrix.os }}
        needs: [build]
        strategy:
            matrix:
                os: [ubuntu-22.04, ubuntu-latest]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
            - name: Integration Tests
              run: |
                  python src/main.py & sleep 5
                  curl -f http://localhost:8080/
    docker-integration-test:
        runs-on: ubuntu-latest
        needs: [docker-build]
        services:
            app-service:
                image: ghcr.io/${{ github.repository }}:${{ github.sha }}
                credentials:
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
                ports:
                    - 8080:8080
                env:
                    FLASK_ENV: production
                    FLASK_DEBUG: "false"
        steps:
            - name: Wait for Service to Boot
              run: sleep 3
            - name: Docker Integration Tests
              run: |
                  curl -s http://localhost:8080/ | jq -e '.message == "Hello World"'
    publish:
        runs-on: ubuntu-latest
        needs: [integration-test, docker-integration-test]
        if: github.event_name == 'push'
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Build package
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build setuptools
                  python -m build --no-isolation
            - name: Upload release package
              uses: actions/upload-artifact@v7
              with:
                  name: hello-actions-release
                  path: dist/
    publish-docker:
        runs-on: ubuntu-latest
        needs: [integration-test, docker-integration-test]
        steps:
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Promote verified image to latest
              uses: docker/build-push-action@v7
              with:
                  context: "container://ghcr.io/${{ github.repository }}:${{ github.sha }}"
                  push: true
                  tags: ghcr.io/${{ github.repository }}:latest
    release:
        runs-on: ubuntu-latest
        needs: [publish, publish-docker]
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Create Official GitHub Release via CLI
              run: |
                  gh release create "\${{ github.ref_name }}" \
                  --title "Release \${{ github.ref_name }}" \
                  --notes "Automated release for version \${{ github.ref_name }}. Code and Docker image verified and compiled under Git SHA: \`${{ github.sha }}\`." \
                  --draft=false \
                  --prerelease=false
