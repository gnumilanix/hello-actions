on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
env:
    PYTHON_VERSION: 3.11
    PYTHON_REQUIREMENTS: src/requirements.txt
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }} -r src/requirements-lint.txt
            - name: Lint
              run: ruff check src --exit-zero
    build:
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
    test-integration:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
            - name: Integration Tests
              run: |
                  python src/main.py & sleep 5
                  curl -f http://localhost:8080/
    release:
        runs-on: ubuntu-latest
        needs: [build, test-integration]
        if: github.event_name == 'push'
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Build package
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build setuptools
                  python -m build --no-isolation
            - name: Upload release package
              uses: actions/upload-artifact@v7
              with:
                  name: hello-actions-release
                  path: dist/
