on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            severity:
                description: "Vulnerability severities to scan for"
                required: true
                type: choice
                default: "CRITICAL,HIGH"
                options:
                    - "CRITICAL"
                    - "CRITICAL,HIGH"
                    - "CRITICAL,HIGH,MEDIUM"
                    - "CRITICAL,HIGH,MEDIUM,LOW"
permissions:
    contents: read
    packages: write
env:
    PYTHON_VERSION: 3.11
    PYTHON_REQUIREMENTS: src/requirements.txt
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff
            - name: Lint
              run: ruff check src
    type-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install mypy
            - name: Type Check
              run: mypy src/
    security-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install bandit
            - name: Security Scan
              run: bandit -r src/
    unit-test:
        runs-on: ubuntu-latest
        needs: [lint, type-check, security-scan]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }} -r src/requirements-test.txt
            - name: Unit tests
              run: pytest -q tests --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  override_branch: main
    build:
        runs-on: ubuntu-latest
        needs: [unit-test]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
    docker-build:
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v7
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
    integration-test:
        runs-on: ${{ matrix.os }}
        needs: [build]
        strategy:
            matrix:
                os: [ubuntu-22.04, ubuntu-latest]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
            - name: Integration Tests
              run: |
                  python src/main.py & sleep 5
                  curl -f http://localhost:8080/
    docker-integration-test:
        runs-on: ubuntu-latest
        needs: [docker-build]
        services:
            app-service:
                image: ghcr.io/${{ github.repository }}:${{ github.sha }}
                credentials:
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
                ports:
                    - 8080:8080
                env:
                    FLASK_ENV: production
                    FLASK_DEBUG: "false"
        steps:
            - name: Wait for Service to Boot
              run: sleep 3
            - name: Docker Integration Tests
              run: |
                  curl -s http://localhost:8080/ | jq -e '.message == "Hello World"'
    docker-security-scan:
        runs-on: ubuntu-latest
        needs: [docker-build]
        permissions:
            security-events: write
        steps:
            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "ghcr.io/${{ github.repository }}:${{ github.sha }}"
                  format: "sarif"
                  output: "trivy-results.sarif"
                  severity: ${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}
              env:
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Trivy Scan Results to GitHub Security Tab
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                  sarif_file: "trivy-results.sarif"
    publish:
        runs-on: ubuntu-latest
        needs: [integration-test, docker-integration-test]
        if: github.event_name == 'push'
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
            - name: Build package
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build setuptools
                  python -m build --no-isolation
            - name: Upload release package
              uses: actions/upload-artifact@v7
              with:
                  name: hello-actions-release
                  path: dist/
    publish-docker:
        runs-on: ubuntu-latest
        needs: [integration-test, docker-integration-test, docker-security-scan]
        steps:
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Install regctl
              uses: regclient/actions/regctl-installer@v0
            - name: Promote verified image to latest
              run: |
                  regctl image copy \
                  ghcr.io/${{ github.repository }}:${{ github.sha }} \
                  ghcr.io/${{ github.repository }}:latest
    release:
        runs-on: ubuntu-latest
        needs: [publish, publish-docker]
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Create Official GitHub Release via CLI
              run: |
                  gh release create "${{ github.ref_name }}" \
                  --target "${{ github.sha }}" \
                  --title "Release ${{ github.ref_name }}" \
                  --notes "Automated release for version ${{ github.ref_name }}. Code and Docker image verified and compiled under Git SHA: `${{ github.sha }}\`." \
                  --draft=false \
                  --prerelease=false
