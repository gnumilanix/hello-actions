on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
env:
    PYTHON_VERSION: 3.11
    PYTHON_REQUIREMENTS: src/requirements.txt
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }} -r src/requirements-lint.txt
            - name: Lint
              run: ruff check src --exit-zero
    build:
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r ${{ env.PYTHON_REQUIREMENTS }}
            - name: Integration Tests
              run: |
                  python src/main.py & sleep 5
                  curl -f http://localhost:8080/